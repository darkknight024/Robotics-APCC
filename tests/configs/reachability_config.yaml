# =============================================================================
# Reachability Test Configuration
# =============================================================================
# Used by: tests/test_reachability.py
#
# Pure IK reachability check — tests if robot end-effector can reach all
# waypoints for each robot/knife/toolpath combination.
#
# For singularity analysis, manipulability, continuity, or any other
# kinematic checks, use the feasibility analysis pipeline instead.

# =============================================================================
# Robots to Test
# =============================================================================
robots_to_use:
  - "IRB 1300-7/1.4"

# =============================================================================
# Knife Poses to Use
# =============================================================================
knife_poses_to_use:
  - "Zund"

# =============================================================================
# I/O Directories
# =============================================================================
toolpaths_folder: "Robot_APCC/Experiments/Experiment_15/Waypoints_Base_Frame"
output_folder: "Robot_APCC/Results/Experiment_15/Reachability"

# =============================================================================
# Processing Options
# =============================================================================
options:
  solver: "eaik"

  # End-effector fixture name from config/fixtures_config.yaml
  # Dynamically injects fixture link/joint into the base URDF at runtime.
  # Set to `null` or omit to use Link_6 (last actuated link) as end-effector.
  # WARNING: Do not use the string "none". Use `null`.
  fixture: null
