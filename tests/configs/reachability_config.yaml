# =============================================================================
# Reachability Test Configuration
# =============================================================================
# Used by: tests/test_reachability.py
#
# Checks if robot end-effector can reach all waypoints in toolpaths
# for each robot/knife/toolpath combination.

# =============================================================================
# Robots to Test
# =============================================================================
# Reference robot names from config/robots_config.yaml
robots_to_use:
  - "IRB 1300-7/1.4"

# =============================================================================
# Knife Poses to Use
# =============================================================================
# Reference knife pose names from config/knife_config.yaml
knife_poses_to_use:
  - "Zund"

# =============================================================================
# I/O Directories
# =============================================================================
# Folder containing toolpath CSVs (T_P_K format, positions in mm)
toolpaths_folder: "Robot_APCC/Experiments/Experiment_15/Waypoints_Base_Frame"

# Output directory for results
output_folder: "Robot_APCC/Results/Experiment_15/Eaik_Reachability_Singularity"

# =============================================================================
# Processing Options
# =============================================================================
options:
  # Solver backend: "pin" (Pinocchio numerical) or "eaik" (EAIK analytical)
  solver: "eaik"

# =============================================================================
# Singularity Analysis
# =============================================================================
# Used by: tests/test_reachability_singularity.py, feasibility_analysis.py
singularity_analysis:
  # Singularity mode: which analyzer to use.
  #   "classified" — SingularityAnalyzer (shoulder / elbow / wrist decomposition)
  #   "unified"    — UnifiedSingularity  (full-Jacobian σ_min only, no type split)
  #   "none"       — skip singularity analysis entirely
  mode: "classified"

  # Generate singularity PNG plots (CSV reports are ALWAYS saved)
  export_singularity_graphs: true

  # Unified-mode threshold: σ_min below this flags the waypoint as singular.
  unified_threshold: 0.01

  # Sub-Jacobian σ_min thresholds for type classification (classified mode).
  # A waypoint is flagged as that singularity type when its
  # sub-Jacobian σ_min drops below the threshold.
  thresholds:
    wrist: 0.1
    shoulder: 0.1
    elbow: 0.1
