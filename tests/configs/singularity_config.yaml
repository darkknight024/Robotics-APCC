# =============================================================================
# Singularity-Only Test Configuration
# =============================================================================
# Used by: tests/test_singularity_only.py
#
# Evaluates joint configurations (J1–J6 in degrees) for kinematic
# singularity using Forward Kinematics + Jacobian analysis.
# No Inverse Kinematics is performed.

# =============================================================================
# Robot
# =============================================================================
# Reference robot name from config/robots_config.yaml (first entry is used)
robots_to_use:
  - "IRB 1300-7/1.4"

# =============================================================================
# Processing Options
# =============================================================================
options:
  # Solver backend for FK / Jacobian computation: "pin" or "eaik"
  solver: "eaik"

  # End-effector fixture name from config/fixtures_config.yaml
  # Dynamically injects fixture link/joint into the base URDF at runtime.
  # Set to `null` or omit to use Link_6 (last actuated link) as end-effector.
  # WARNING: Do not use the string "none". Use `null`.
  fixture: null

# =============================================================================
# I/O Paths
# =============================================================================
# Path to a folder of joint-configuration CSVs, OR a single CSV file.
# If a folder is given, every *.csv inside it is processed.
# If a single .csv file is given, only that file is processed.
# CLI --joints-folder / --joints-csv overrides this value.
joints_input: "Robot_APCC/Experiments/Experiment_17/wrist_singularity/waypoints/random_joint_configurations"

# Base output directory for results.
# Each input CSV produces its own sub-file: <output_folder>/<csv_stem>_singularity_report.csv
# A combined text summary is saved as <output_folder>/singularity_analysis.txt
# CLI --output / -o overrides this value.
output_folder: "Robot_APCC/Results/Experiment_17"

# =============================================================================
# Singularity Analysis
# =============================================================================
singularity_analysis:
  # Singularity mode (both handled by core.checks.singularity.SingularityAnalyzer):
  #   "classified" — shoulder / elbow / wrist sub-type decomposition
  #   "unified"    — full-Jacobian σ_min only, no type split
  #   "none"       — skip singularity analysis entirely
  mode: "classified"

  # Generate singularity PNG plots (CSV reports are ALWAYS saved)
  export_singularity_graphs: true

  # Unified-mode threshold: σ_min below this flags the waypoint as singular.
  unified_threshold: 0.01

  # Wrist-singularity J5 geometric check (classified mode only).
  # When true, wrist singularity is detected by checking if |q5| < j5_threshold_deg
  # instead of using the wrist sub-Jacobian σ_min. Matches ABB RobotWare dead-band.
  check_j5_only: true

  # J5 angle threshold in degrees (used only when check_j5_only is true).
  # Waypoint is flagged wrist-singular when |q5| < this value.
  j5_threshold_deg: 0.76

  # Sub-Jacobian σ_min thresholds for type classification (classified mode).
  # A waypoint is flagged as that singularity type when its
  # sub-Jacobian σ_min drops below the threshold.
  thresholds:
    wrist: 0.1
    shoulder: 0.1
    elbow: 0.1
