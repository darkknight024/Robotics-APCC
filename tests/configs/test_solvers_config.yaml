# =============================================================================
# RobotStudio Test Trajectory Configuration
# =============================================================================
# Configuration for FK/IK comparison with RobotStudio test trajectories.
# Used by test_solvers.py

# =============================================================================
# Robot to Use
# =============================================================================
# Reference robot name from config/robots_config.yaml
robot_name: "IRB 1300-7/1.4"

# =============================================================================
# I/O Directories
# =============================================================================
input_folder: "Robot_APCC/Experiments/Experiment_8/square_profile_trajectories_sampled"
output_folder: "Robot_APCC/Results_new/Experiment_8/EAIK"

# =============================================================================
# Processing Options
# =============================================================================
options:
  # Solver backend: "pin" (Pinocchio numerical) or "eaik" (EAIK analytical)
  solver: "eaik"

  # Use adaptive scaling for plots (if false, uniform scale)
  adaptive_scale: false
  
  # Generate FK comparison plots
  generate_fk_plots: false
  
  # Generate IK comparison plots
  generate_ik_plots: false
