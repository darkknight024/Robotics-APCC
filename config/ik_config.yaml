# =============================================================================
# IK Solver Configuration
# =============================================================================
# Configuration parameters for the Pinocchio-based inverse kinematics solver.
# These values are used by the IKSolver class in core/ik_solver.py.

ik_parameters:
  # Maximum number of iterations for convergence
  max_iterations: 50
  
  # Convergence tolerance (residual norm threshold)
  tolerance: 1.0e-4
  
  # Weight for rotation error in cost function
  rot_weight: 0.2
  
  # Weight for translation error in cost function
  trans_weight: 1.0
  
  # Initial damping factor for Levenberg-Marquardt
  lambda0: 1.0e-3
  
  # Maximum damping factor
  lambda_max: 1.0e1
  
  # Maximum step size per iteration (radians)
  max_step: 0.2
  
  # Enable backtracking line search
  backtrack: true
  
  # End-effector frame name in URDF either Link_6 or ee_link
  ee_frame_name: "ee_link"

  # =========================================================================
  # IK Initialization Strategies
  # =========================================================================
  # Controls which initialization methods solve_with_retries() will attempt.
  # At least one must be true. Order: initial_guess → neutral → random.
  
  # Try with provided initial guess (previous joint config)
  use_initial_guess: true
  
  # Try with neutral (zero) configuration
  use_neutral: true
  
  # Try with random configurations
  use_random: true
  
  # Number of random configuration retries (if use_random is true)
  num_random_retries: 3
