# =============================================================================
# IK Solver Configuration
# =============================================================================
# Configuration parameters for IK solvers (Pinocchio and EAIK).
# Pinocchio-specific parameters are ignored when using EAIK, and vice versa.

ik_parameters:
  # Maximum number of iterations for convergence
  max_iterations: 50
  
  # Convergence tolerance (residual norm threshold)
  tolerance: 1.0e-4
  
  # Weight for rotation error in cost function
  rot_weight: 0.2
  
  # Weight for translation error in cost function
  trans_weight: 1.0
  
  # Initial damping factor for Levenberg-Marquardt
  lambda0: 1.0e-3
  
  # Maximum damping factor
  lambda_max: 1.0e1
  
  # Maximum step size per iteration (radians)
  max_step: 0.2
  
  # Enable backtracking line search
  backtrack: true

  # =========================================================================
  # --- EAIK-specific parameters ---

  # ConfigurationMode — controls which IK solution is selected from all exact
  # candidates.  Mirrors ABB RobotStudio's ConfigurationMode enum.
  #
  #   "Compliant" - Solution must be within ±1 quadrant of the previous
  #                 waypoint's cf1, cf4, cf6, and cfx must be exactly equal.
  #                 First waypoint always uses min_norm (no previous config).
  #
  #   "Ignore"    - Stored configuration is ignored entirely.
  #                 Sub-behaviour controlled by solution_selection below.
  configuration_mode: "Compliant"

  # Solution selection strategy (used for Ignore mode, and as tiebreaker):
  #   "closest"  - Pick solution closest to previous q (chained nearest-neighbour).
  #                First waypoint uses min_norm.
  #   "min_norm" - Always pick solution with smallest joint norm (stateless).
  solution_selection: "closest"

  # FK verification tolerances — after EAIK finds candidate IK solutions,
  # each one is forward-kinematically verified against the original target.
  # Solutions whose FK pose exceeds these thresholds are rejected.
  fk_pos_tolerance_m: 1.0e-3     # 1 mm position tolerance
  fk_rot_tolerance_deg: 0.02     # 0.02 degrees orientation tolerance

  # =========================================================================
  # IK Initialization Strategies
  # =========================================================================
  # Controls which initialization methods solve_with_retries() will attempt.
  # At least one must be true. Order: initial_guess → neutral → random.
  
  # Try with provided initial guess (previous joint config)
  use_initial_guess: true
  
  # Try with neutral (zero) configuration
  use_neutral: true
  
  # Try with random configurations
  use_random: true
  
  # Number of random configuration retries (if use_random is true)
  num_random_retries: 3
