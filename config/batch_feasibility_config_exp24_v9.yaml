# =============================================================================
# Batch Feasibility Analysis — Experiment 24 v9 snake orientation test
# Single toolpath, Zund knife pose, full plot suite for visual evidence.
#
# Notes:
#   - use_base_frame: false + Zund → T_P_K → T_B_P via knife pose
#   - IK ee_frame_name from ik_config.yaml: ee_link (fixture URDF)
#   - waypoint_density off → CSV TCP speeds unused
#   - feature3_d1 off → CSV zone data unused
# =============================================================================
robots_to_use:
  - "IRB 1300-7/1.4"

knife_poses_to_use:
  - "Zund"

# Single representative CSV (geometry identical across v/zone variants).
toolpaths_folder: "Robot_APCC/Experiments/Experiement_24/Toolpaths/v9_snake_toolpaths_orientation_test_single"
# Standalone RobotStudio recordings (same basename as toolpath). Used by
# feasibility_analysis.py --robotstudio-csv <folder>; not read by batch YAML
# directly unless the CLI/script resolves it.
robotstudio_folder: "Robot_APCC/Experiments/Experiement_24/Results - RobotStudio/v9_snake_toolpaths_orientation_test"
output_folder: "Robot_APCC/Results/Experiment_24/v9_snake_orientation_test_feasibility_vs_rs"
use_base_frame: false

solver: "eaik"

output:
  level1_only: true
  save_analysis: true

# 0 = no early termination — report every unreachable waypoint
max_ik_failures_per_trajectory: 0

reachability:
  generate_graphs: true

eaik_multi_solution:
  enabled: true
  weights:
    c0: 10.0
    singularity: 10.0
    manipulability: 0.0
    branch_discontinuity: 10.0
  generate_graphs: true
  max_waypoints_in_graph: 10000

singularity:
  enabled: true
  mode: "unified"
  threshold: 0.01
  type_thresholds:
    wrist: 0.1
    shoulder: 0.1
    elbow: 0.1
  check_j5_only: true
  j5_threshold_deg: 0.76
  generate_graphs: true

manipulability:
  enabled: true
  warning: 0.001
  translational_warning: 0.001
  rotational_warning: 0.001
  directional_warning: 0.01
  generate_graphs: true

continuity:
  enabled: true
  enable_c1: true
  pose_scale_m_per_rad: 0.1
  safety_factor: 1.05
  default_speed_mm_s: 100.0
  generate_graphs: true

waypoint_density:
  enabled: false
  check_frequency_hz: 50.0
  max_gap_mm: 4.5
  interpolate_sparse: false
  default_speed_mm_s: 100.0
  generate_graphs: false
  task_space_graphs: true

topp_ra:
  enabled: true
  generate_graphs: true

feature3_d1:
  enabled: false

ranking:
  safety_bin_size: 10.0
  smoothness_weight: 1.0
  dexterity_weight: 1.0
