# =============================================================================
# Fixture Configuration
# =============================================================================
# Defines end-effector fixture poses relative to Link_6 (robot flange).
# Each entry represents a calibrated tool center point (TCP) that can be
# referenced by name in robots_config.yaml via the `fixture_name` field.
#
# When fixture_name is set to "Link_6" in robots_config.yaml, no additional
# fixture transform is applied — the robot flange itself is tracked.
#
# Optional ``stl``: collision/visual mesh for the fixture, expressed in the
# fixture frame (same origin as xyz/rpy below). Absolute paths are allowed.
# ``visualize_robot.py`` loads every entry with a non-empty ``stl`` onto
# ``parent_link`` (default Link_6). ``scale`` is a uniform vertex scale
# (1.0 if the STL is already in metres; use 0.001 for millimetre meshes).

fixtures:
  assembly_atif:
    description: "Assembly ATIF component (refaticenter)"
    parent_link: "Link_6"
    origin:
      xyz: [0.0, 0.0, 0.0]
      rpy: [0.0, 0.0, 0.0]
    stl: "/home/koushik/Nike/Robotics-APCC/Assets/Robot APCC/meshes/assembly_refaticenter_000_atif.stl"
    # scale: 0.001
    scale: 0.001

  assembly_atim:
