# =============================================================================
# Fixture Configuration
# =============================================================================
# Defines end-effector fixture poses relative to Link_6 (robot flange).
# Each entry represents a calibrated tool center point (TCP) that can be
# referenced by name in robots_config.yaml via the `fixture_name` field.
#
# When fixture_name is set to "Link_6" in robots_config.yaml, no additional
# fixture transform is applied — the robot flange itself is tracked.
#
# Optional ``stl``: collision/visual mesh for the fixture, expressed in the
# fixture frame (same origin as xyz/rpy below). Path is relative to repo root.
# Current ``ee_link.stl`` is empty: IK/FK use this TCP, collision attaches
# no fixture mesh. See ``config/collision_config.yaml`` for the URDF +
# fixture_name used by Experiment 25 / collision checks.
# ``scale`` is a uniform vertex scale (1.0 if the STL is already in metres).

fixtures:
  ee_link:
    description: "Default APCC fixture (calibrated tool center point)"
    parent_link: "Link_6"
    origin:
      xyz: [0.0998237, 0.123033, 0.0828027]
      rpy: [0.001199, 0.000599, 2.782547]
    stl: ""
    scale: 1.0
