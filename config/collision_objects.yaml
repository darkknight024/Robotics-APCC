# =============================================================================
# Scene Objects Configuration (collision + Viser)
# =============================================================================
# Static cell meshes for Feature 4 collision and the Viser scene viewer.
#
# Collision contract (robot base frame):
#   position_mm     - [x, y, z] translation in millimetres
#   quat_wxyz       - [qw, qx, qy, qz] orientation (REQUIRED for collision)
#   mesh_path       - path to STL (relative to repo root)
#   scale           - uniform mesh vertex scale for Pinocchio
#                     Exp25 STLs are already in metres → use 1.0
#                     millimetre-vertex STLs → use 0.001
#   collision       - true/false; false skips the object in collision checking
#
# orientation_deg may be kept for viewer reference but is NOT used by the
# collision checker — quat_wxyz is the source of truth.
#
# Viewer-only fields (ignored by collision): type, color, dimensions_mm, etc.

