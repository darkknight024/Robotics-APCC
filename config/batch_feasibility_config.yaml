# =============================================================================
# Batch Feasibility Analysis Configuration
# =============================================================================
# Each functional group owns its settings, thresholds, and graph toggle.
# Rule: if enabled=true AND generate_graphs=true, all graphs for that
# group are produced (per-trajectory + aggregated).

# =============================================================================
# I/O
# =============================================================================
robots_to_use:
  - "IRB 1300-7/1.4"

knife_poses_to_use:
  - "pose_1"
  
toolpaths_folder: "Robot_APCC/Experiments/Experiment_21/Results - RobotStudio"
output_folder: "Robot_APCC/Results/Experiment_21/Fesability_refactor"
use_base_frame: true

# =============================================================================
# Solver
# =============================================================================
solver: "eaik"

# =============================================================================
# Output
# =============================================================================
output:
  level1_only: true
  save_analysis: true

# =============================================================================
# Performance
# =============================================================================
max_ik_failures_per_trajectory: 1

# =============================================================================
# Reachability (always runs — IK is the foundation)
# =============================================================================
reachability:
  generate_graphs: false

# =============================================================================
# EAIK Multi-Solution Optimisation
# =============================================================================
# When solver is "eaik", scores every valid IK candidate per waypoint
# against the previous configuration and picks the lowest-cost one.
# Ignored when solver is "pin".
eaik_multi_solution:
  enabled: true
  weights:
    c0: 10.0
    singularity: 10.0
    manipulability: 0.0
    branch_discontinuity: 10.0
  generate_graphs: true
  max_waypoints_in_graph: 10000

# =============================================================================
# Singularity
# =============================================================================
singularity:
  enabled: true
  mode: "unified"
  threshold: 0.01
  # Classified-mode settings (only used when mode=classified):
  type_thresholds:
    wrist: 0.1
    shoulder: 0.1
    elbow: 0.1
  check_j5_only: true
  j5_threshold_deg: 0.76
  generate_graphs: true

# =============================================================================
# Manipulability
# =============================================================================
manipulability:
  enabled: true
  warning: 0.001
  translational_warning: 0.001
  rotational_warning: 0.001
  directional_warning: 0.01
  generate_graphs: true

# =============================================================================
# Continuity (C0 + C1)
# =============================================================================
continuity:
  enabled: true
  # C1 (TOPP-RA velocity-level) checks and C1 graphs; C0 uses ``enabled`` above
  enable_c1: false
  pose_scale_m_per_rad: 0.1
  safety_factor: 1.05
  default_speed_mm_s: 100.0
  generate_graphs: true

# =============================================================================
# Waypoint Density (pre-IK check)false
# =============================================================================
waypoint_density:
  enabled: true
  check_frequency_hz: 50.0
  max_gap_mm: 4.5
  interpolate_sparse: true
  default_speed_mm_s: 100.0
  generate_graphs: true

# =============================================================================
# TOPP-RA
# =============================================================================
topp_ra:
  enabled: true
  generate_graphs: true

# =============================================================================
# Feature 3 Deliverable 1 — Speed Profile Prediction
# =============================================================================
# Predicts the actual TCP speed profile given per-waypoint zone data.
# Requires toolpath CSV with zone columns (pzone_tcp, pzone_ori, zone_ori).
feature3_d1:
  enabled: false
  custom_zone: false            # false → preset zone number (z0,z1,…); true → (pzone_tcp,pzone_ori,zone_ori)
  # ===========================================================================
  # [ESTIMATE — NEEDS FURTHER MODELING] The constants below are crude
  # placeholders, not calibrated physics. Track them until proper models land:
  #   a_tcp_mm_s2              — scalar TCP accel capability; supplanted by
  #                              Jacobian dynamics when use_jacobian_dynamics=true
  #   T_settle_s               — fine-point settling time; never measured on site
  #   joint_accel_limit_scale  — fudge factor on the Exp24 joint accel limits;
  #                              the per-configuration/payload dynamics model
  #                              (inertia, motor torque curves) is not built yet
  # ===========================================================================
  a_tcp_mm_s2: 2500.0         # [ESTIMATE] Effective TCP acceleration capability (mm/s²)
  T_settle_s: 0.2             # [ESTIMATE] Fine-point settling time (seconds)
  is_calibrated: false         # Set true ONLY after V1/V2 calibration
  # Path sampling resolution
  ds_mm: 5.0                  # Arc-length spacing between dense samples (mm)
  # Defaults when CSV columns are absent
  default_zone: "fine"         # Fallback zone if zone columns missing
  default_v_cmd_mm_s: 300.0   # Fallback commanded speed if speed column missing
  # Near-straight waypoint jitter should not create artificial corner slowdowns.
  enable_near_collinear_skip: true
  min_corner_deflection_deg: 3.0
  # Per-ceiling toggles for Feature 3 M5 (min of enabled ceilings → v_actual).
  # Temporarily disable blend / corner slowdowns to study joint demand at v_cmd.
  enable_blend_centripetal_ceiling: false  # √(a_n·ρ·ρ_scale) + Jacobian centripetal tighten
  enable_corner_dip_ceiling: false         # k_corner_dip CornerPathReduction model
  enable_joint_velocity_ceiling: true
  enable_orientation_ceiling: false
  # Joint acceleration is not a min-ceiling: it bounds the forward/backward
  # reachability ramps (per-sample Jacobian tangential a_accel/a_decel).
  # Its magnitude is scaled by joint_accel_limit_scale below ([ESTIMATE]).
  enable_joint_acceleration_ceiling: true
  # Output toggles
  generate_plots: true         # Speed profile, joint utilisation, blend geometry PNGs
  generate_report: true        # JSON report with all scalar metrics
  # ── F3 D2: TOPP-RA time-optimal + no-dip constant TCP speed limits ──
  # Both require use_jacobian_dynamics=true on the robot config so that
  # JointDynamicsCalibration (q_dot_max, q_ddot_accel/decel) is loaded.
  compute_time_optimal: false      # Feature A: TOPP-RA on the fixed blended q*
  compute_corner_limits: false     # Feature B: per-corner + global no-dip constant TCP speed
  apply_topp_ceiling: false        # If true: re-run M5 with the TOPP v_tcp as v_topp_ceiling
  corner_analysis_ds_mm: 0.5       # Fine ds (mm) for local IK re-sample of tight/sub-mm arcs
  topp_n_gridpoints: 0             # 0 → min(len(knots), 1000); avoids 10k+ LP blowups
  topp_max_knots: 2000             # Cap TOPP-RA spline knots (all blend samples kept)
  # Multiplier on robots_config.yaml joint accel/decel limits for Features A/B
  # and the M5 joint-accel ceiling.  Limits are now the observed peaks from
  # Exp24 v8 RS (vel_test_100_50_50_z200_v6000); keep at 1.0 unless you want
  # to deliberately over/under-bind relative to that recording.
  joint_accel_limit_scale: 1.0

# =============================================================================
# Ranking (used by combinatorial search only)
# =============================================================================
ranking:
  safety_bin_size: 10.0
  smoothness_weight: 1.0
  dexterity_weight: 1.0
