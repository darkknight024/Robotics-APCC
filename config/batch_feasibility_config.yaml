# =============================================================================
# Batch Feasibility Analysis Configuration
# =============================================================================
# Each functional group owns its settings, thresholds, and graph toggle.
# Rule: if enabled=true AND generate_graphs=true, all graphs for that
# group are produced (per-trajectory + aggregated).

# =============================================================================
# I/O
# =============================================================================
robots_to_use:
  - "IRB 1300-7/1.4"

knife_poses_to_use:
  - "pose_1"

toolpaths_folder: "Assets/Robot APCC/Toolpaths/Sample"
output_folder: "output/feasibility_batch"
use_base_frame: false

# =============================================================================
# Solver
# =============================================================================
solver: "pin"

# =============================================================================
# Output
# =============================================================================
output:
  level1_only: true
  save_analysis: true

# =============================================================================
# Performance
# =============================================================================
max_ik_failures_per_trajectory: 1

# =============================================================================
# Reachability (always runs — IK is the foundation)
# =============================================================================
reachability:
  generate_graphs: true

# =============================================================================
# EAIK Multi-Solution Optimisation
# =============================================================================
# When solver is "eaik", scores every valid IK candidate per waypoint
# against the previous configuration and picks the lowest-cost one.
# Ignored when solver is "pin".
eaik_multi_solution:
  enabled: true
  weights:
    c0: 10.0
    singularity: 1.0
    manipulability: 0.5
  generate_graphs: true
  max_waypoints_in_graph: 25

# =============================================================================
# Singularity
# =============================================================================
singularity:
  enabled: true
  mode: "unified"
  threshold: 0.01
  # Classified-mode settings (only used when mode=classified):
  type_thresholds:
    wrist: 0.1
    shoulder: 0.1
    elbow: 0.1
  check_j5_only: true
  j5_threshold_deg: 0.76
  generate_graphs: true

# =============================================================================
# Manipulability
# =============================================================================
manipulability:
  enabled: true
  warning: 0.001
  translational_warning: 0.001
  rotational_warning: 0.001
  directional_warning: 0.01
  generate_graphs: true

# =============================================================================
# Continuity (C0 + C1)
# =============================================================================
continuity:
  enabled: true
  pose_scale_m_per_rad: 0.1
  safety_factor: 1.05
  default_speed_mm_s: 100.0
  generate_graphs: true

# =============================================================================
# Waypoint Density (pre-IK check)
# =============================================================================
waypoint_density:
  enabled: true
  check_frequency_hz: 50.0
  max_gap_mm: 5.0
  interpolate_sparse: false
  default_speed_mm_s: 100.0
  generate_graphs: true

# =============================================================================
# TOPP-RA (always runs — cannot be disabled)
# =============================================================================
topp_ra:
  generate_graphs: true

# =============================================================================
# Ranking (used by combinatorial search only)
# =============================================================================
ranking:
  safety_bin_size: 10.0
  smoothness_weight: 1.0
  dexterity_weight: 1.0
