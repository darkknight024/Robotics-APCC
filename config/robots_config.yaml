# =============================================================================
# Robot Configuration Database
# =============================================================================
# Central configuration for all robot models.
# Other config files reference robots by name from this file.

# Global constants for trajectory feasibility analysis
constants:
  # Maximum allowed joint jump between consecutive waypoints (C0 continuity check)
  # This prevents excessive joint angle changes that could cause jerky motion
  joint_jump_limit_rad: 0.5  # 0.5 radians ≈ 28.6 degrees

robots:
  # -------------------------------------------------------------------------
  # IRB 1300-7/1.4 - Primary robot for APCC project
  # -------------------------------------------------------------------------
  - name: "IRB 1300-7/1.4"
    description: "ABB IRB 1300 with 7kg payload, 1.4m reach"
    urdf_path: "Assets/Robot APCC/IRB_1300_1400_URDF/urdf/IRB_1300_1400_URDF_with_fixture.urdf"
    reach_m: 1.4
    payload_kg: 7
    velocity_limits_rad_s: [4.443, 3.142, 4.312, 8.727, 7.245, 12.566]
    acceleration_limits_rad_s2: [10.0, 10.0, 10.0, 20.0, 20.0, 30.0] # just for testing not an actual limit (FIX ME)
    # Calibration — from Experiment 23 RobotStudio data (2026-04-15)
    calibration:
      a_tcp_mm_s2: 6128.0              # Effective TCP acceleration (distance-based from V1 straight-line)
      a_tcp_decel_mm_s2: 14244.0       # Effective TCP deceleration (asymmetric — ABB brakes harder)
      T_settle_s: 0.2                  # Fine-point settling time (NOT calibrated — proposal default)
      is_calibrated: true
      blend_model_rmse_mm_s: 56.9      # v_blend model RMSE against 30 corner observations
      calibration_source: "Experiment_23"
      calibrated_date: "2026-04-15"

  # -------------------------------------------------------------------------
  # IRB 1300-10/1.15 - Higher payload, shorter reach variant
  # -------------------------------------------------------------------------
  - name: "IRB 1300-10/1.15"
    description: "ABB IRB 1300 with 10kg payload, 1.15m reach"
    urdf_path: "Assets/Robot APCC/IRB_1300_1150_URDF/IRB-1300-1150 URDF_v2/urdf/IRB_1300_1150_URDF_with_fixture.urdf"  
    reach_m: 1.15
    payload_kg: 10
    velocity_limits_rad_s: [4.887, 3.979, 5.864, 8.727, 7.245, 12.566]
    acceleration_limits_rad_s2: [10.0, 10.0, 10.0, 20.0, 20.0, 30.0] # just for testing not an actual limit (FIX ME)

  # -------------------------------------------------------------------------
  # IRB 1300-11/0.9 - Maximum payload, minimum reach variant
  # -------------------------------------------------------------------------
  - name: "IRB 1300-11/0.9"
    description: "ABB IRB 1300 with 11kg payload, 0.9m reach"
    urdf_path: "Assets/Robot APCC/IRB_1300_900_URDF/IRB-1300-900 URDF_v2/urdf/IRB_1300_900_URDF_with_fixture.urdf"
    reach_m: 0.9
    payload_kg: 11
    velocity_limits_rad_s: [4.887, 3.979, 5.760, 8.727, 7.245, 12.566]
    acceleration_limits_rad_s2: [10.0, 10.0, 10.0, 20.0, 20.0, 30.0] # just for testing not an actual limit (FIX ME)
