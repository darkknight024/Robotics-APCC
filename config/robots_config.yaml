# =============================================================================
# Robot Configuration Database
# =============================================================================
# Central configuration for all robot models.
# Other config files reference robots by name from this file.

# Global constants for trajectory feasibility analysis
constants:
  # Maximum allowed joint jump between consecutive waypoints (C0 continuity check)
  # This prevents excessive joint angle changes that could cause jerky motion
  joint_jump_limit_rad: 1.0  # 1.0 radians ≈ 57.3 degrees

robots:
  # -------------------------------------------------------------------------
  # IRB 1300-7/1.4 - Primary robot for APCC project
  # -------------------------------------------------------------------------
  - name: "IRB 1300-7/1.4"
    description: "ABB IRB 1300 with 7kg payload, 1.4m reach"
    urdf_path: "Assets/Robot APCC/IRB_1300_1400_URDF/urdf/IRB_1300_1400_URDF.urdf"
    fixture_name: "ee_link"
    reach_m: 1.4
    payload_kg: 7
    velocity_limits_rad_s: [4.443, 3.142, 4.312, 8.727, 7.245, 12.566]
    # Per-joint acceleration limits — p99 of observed |q̈| from the Experiment 24
    # v9 snake-orientation RobotStudio recordings (min of accel/decel p99).
    # Replaces the old [10,10,10,20,20,30] placeholder that made TOPP-RA
    # time-optimal crawl (esp. the broken v8 J4=144 deg/s² value).
    # Source: Results - RobotStudio/v9_snake_toolpaths_orientation_test/*.csv
    acceleration_limits_rad_s2: [22.39, 74.49, 92.59, 1004.25, 405.29, 982.93]
    # Calibration — from Experiment 23 RobotStudio data (tuned 2026-04-20)
    calibration:
      # [ESTIMATE — NEEDS FURTHER MODELING] the four scalar TCP accel
      # constants below are pose-independent approximations fit to a
      # handful of RS recordings; the Jacobian dynamics path supersedes
      # them when use_jacobian_dynamics=true.
      a_tcp_mm_s2: 10000.0 #12747.0              # [ESTIMATE] Peak TCP acceleration (distance-based from V1 straight-line)
                                       # used as the centripetal capability for the blend ceiling
      a_tcp_decel_mm_s2: 10000.0 #10672.0       # [ESTIMATE] Peak TCP deceleration (asymmetric — ABB brakes harder)
      # Effective trapezoidal accelerations — model ABB's S-curve as a trapezoid
      # with matching total ramp distance.  Lower than the peak because the
      # S-curve is jerk-limited near v=0 and v=v_peak.
      a_accel_eff_mm_s2: 10000.0        # Tuned on V2 corner v500: mean RMS drops 63→57 mm/s
      a_decel_eff_mm_s2: 10000.0       # ABB's peak decel from stop is ~14 k mm/s²; 10 k
                                       # matches the ramp into fine points best on V2
      # Blend-arc geometry: symmetric cubic Bézier with shape parameter k
      # controlling how far the inner control points sit from the programmed
      # corner:  P1 = entry + k·r·dir_in,  P2 = exit − k·r·dir_out.
      #
      #   k = 0       → degenerate straight line (ignores the corner)
      #   k = 2/3     → quadratic Bézier equivalent (classic "parabolic" blend)
      #   k = 0.78    → best least-squares fit to RS Signal-Analyser recordings
      #                 across ALL corner angles (30°, 60°, 90°, 120°, 150°
      #                 interior) and ALL zones (z0/z1/z5/z10/z50) at both v20
      #                 and v500 speeds; residual <0.12 mm RMS on all matched
      #                 geometries (see test `fit_cubic_bezier_to_rs`).
      blend_shape_k: 0.78
      # ρ_min safety/correction factor for the centripetal speed ceiling.
      # Now that the cubic-Bézier geometry matches the ABB blend directly,
      # no empirical radius scaling is needed — keep at 1.0 unless a future
      # controller variant demands otherwise.
      rho_min_scale: 1.0
      # Normal-acceleration inner limit used INSIDE blend arcs.  ABB's IRC5
      # motion planner is jerk-limited, so the centripetal (normal) accel it
      # commits to at tight-corner apexes is smaller than the peak tangential
      # capability ``a_tcp``.  That is what produces the characteristic speed
      # dip at ``z0/z1`` apexes (e.g. RS dips to ~12 mm/s at a 150°-deflection
      # z1 corner from v_cmd = 20 mm/s, while a naive ``sqrt(a_tcp·ρ)`` ceiling
      # would only dip to ~17.5 mm/s).  Fit:  v_dip² / ρ_min → 3100 mm/s²
      # (from `30_deg_corner_z1` apex in V2 corner recordings).  Set to 0 to
      # disable and fall back to ``a_tcp``.
      a_n_blend_mm_s2: 0
      # Universal corner-speed-reduction coefficient k_corner.  RobotStudio
      # shows a systematic ~10–15 % speed dip at EVERY blend apex, even for
      # large zones (z5 … z50) where the centripetal ceiling does not bind.
      # The mechanism is the IRC5 S-curve/jerk-limit planner rotating the
      # velocity-vector direction across the blend ("CornerPathReduction" in
      # ABB's system parameters).  We model it as
      #   v_dip ≈ v_cmd · (1 − k_corner · sin(δ/2) · 4·t·(1−t))
      # where δ = deflection angle (how much the TCP direction rotates across
      # the corner).  Empirically k_corner = 0.50 matches the z5/z10/z50 dips
      # on the v20 and v500 corner sets within ~1 mm/s.  Set to 0 to disable.
      k_corner_dip: 0.50
      max_orientation_speed_deg_s: 1000.0 # Hard TCP orientation-speed ceiling from RobotStudio vmax setting
      # Experiment 24 measured per-joint dynamics.
      # Values are stored here in degrees for readability and converted to
      # radians by core/calibration/joint_dynamics.py.
      #
      # q_dot_max_deg_s: measured well — treated as reliable (Exp24 v1).
      # q_ddot_*_deg_s2: peak signed accel / decel observed on
      #   Experiement_24/Results - RobotStudio/v8_snake_toolpath_with_variable_wp_spacing
      #   /vel_test_100_50_50_z200_v6000.csv (rs_j*_accel_deg_s2).
      #   accel = max(q̈), decel = −min(q̈) per joint.  These are observed
      #   peaks on that path (not a full dynamics model); F3 D2 may still
      #   scale them via feature3_d1.joint_accel_limit_scale.
      joint_dynamics:
        source: Experiment_24_v9
        configuration: neutral
        q_dot_max_deg_s: [280.0, 180.0, 250.0, 500.0, 415.8, 720.0]
        # p99 of observed per-joint |q̈| from Exp24 v9 snake-orientation RS runs.
        # The old v8 values (esp. J4=144 deg/s²) were unreliable and made the
        # F3 D2 time-optimal / no-dip speeds collapse.
        q_ddot_accel_deg_s2: [1586, 4268, 5311, 67164, 23221, 60116]   # v9 RS p99 accel
        q_ddot_decel_deg_s2: [1283, 4343, 5305, 57539, 23449, 56318]   # v9 RS p99 |decel|
      use_jacobian_dynamics: true
      T_settle_s: 0.2                  # [ESTIMATE — NEEDS FURTHER MODELING] fine-point settling time; never measured
      is_calibrated: true
      calibration_source: "Experiment_23"
      calibrated_date: '2026-05-05'

  # -------------------------------------------------------------------------
  # IRB 1300-10/1.15 - Higher payload, shorter reach variant
  # -------------------------------------------------------------------------
  - name: "IRB 1300-10/1.15"
    description: "ABB IRB 1300 with 10kg payload, 1.15m reach"
    urdf_path: "Assets/Robot APCC/IRB_1300_1150_URDF/IRB-1300-1150 URDF_v2/urdf/IRB_1300_1150_URDF.urdf"
    fixture_name: "ee_link"
    reach_m: 1.15
    payload_kg: 10
    velocity_limits_rad_s: [4.887, 3.979, 5.864, 8.727, 7.245, 12.566]
    acceleration_limits_rad_s2: [10.0, 10.0, 10.0, 20.0, 20.0, 30.0] # just for testing not an actual limit (FIX ME)

  # -------------------------------------------------------------------------
  # IRB 1300-11/0.9 - Maximum payload, minimum reach variant
  # -------------------------------------------------------------------------
  - name: "IRB 1300-11/0.9"
    description: "ABB IRB 1300 with 11kg payload, 0.9m reach"
    urdf_path: "Assets/Robot APCC/IRB_1300_900_URDF/IRB-1300-900 URDF_v2/urdf/IRB_1300_900_URDF.urdf"
    fixture_name: "ee_link"
    reach_m: 0.9
    payload_kg: 11
    velocity_limits_rad_s: [4.887, 3.979, 5.760, 8.727, 7.245, 12.566]
    acceleration_limits_rad_s2: [10.0, 10.0, 10.0, 20.0, 20.0, 30.0] # just for testing not an actual limit (FIX ME)
